<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NetGuardian</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon48.png" alt="" width="24" height="24" />
      <h3>NetGuardian</h3>
    </header>

    <label class="row toggle-row">
      <span>Protection</span>
      <input id="toggleEnabled" type="checkbox" />
    </label>

    <label class="row">
      <span for="roleSelect">Role</span>
      <select id="roleSelect">
        <option value="Minor">Minor</option>
        <option value="Adult">Adult</option>
        <option value="Parent">Parent</option>
      </select>
    </label>

    <p class="hint">Role sets a sensible default sensitivity. Fine-tune it in Settings.</p>

    <button id="openOptions" type="button">Open Settings</button>
    <small id="status" role="status" aria-live="polite"></small>
  </div>
  <script src="popup.js"></script>
</body>
</html>
