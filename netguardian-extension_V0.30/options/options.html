<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NetGuardian Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h2>NetGuardian Settings</h2>

    <section>
      <label for="threshold">
        Sensitivity threshold
        <span id="thresholdValue" class="value"></span>
      </label>
      <input id="threshold" type="range" min="0.1" max="0.95" step="0.05" />
      <p class="hint">
        Lower values blur more aggressively (more false positives). Higher values only
        blur high-confidence matches. This overrides the default for your selected role
        until you change role again from the toolbar popup.
      </p>
    </section>

    <button id="save" type="button">Save</button>
    <small id="status" role="status" aria-live="polite"></small>
  </main>
  <script src="options.js"></script>
</body>
</html>
